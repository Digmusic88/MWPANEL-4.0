# MW Panel Proxy Configuration for System Nginx
# Place this file in: /etc/nginx/sites-available/mw-panel
# Enable with: sudo ln -s /etc/nginx/sites-available/mw-panel /etc/nginx/sites-enabled/

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name plataforma.mundoworld.school localhost;
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS proxy to MW Panel containers
server {
    listen 443 ssl http2;
    server_name plataforma.mundoworld.school localhost;
    
    # Use existing SSL certificates
    ssl_certificate /opt/mw-panel/ssl/cloudflare/cert.pem;
    ssl_certificate_key /opt/mw-panel/ssl/cloudflare/key.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # Proxy all traffic to our MW Panel nginx
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse off;
        proxy_buffering off;
    }
}