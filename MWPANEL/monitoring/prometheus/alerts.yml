groups:
  - name: mw-panel-alerts
    interval: 30s
    rules:
      # High error rate alert
      - alert: HighErrorRate
        expr: rate(http_requests_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for the last 5 minutes"

      # High response time alert
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is above 2 seconds"

      # Database connection issues
      - alert: DatabaseConnectionIssue
        expr: db_connections_active{state="active"} < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection issue"
          description: "No active database connections detected"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (nodejs_memory_usage_bytes{type="heapUsed"} / nodejs_memory_usage_bytes{type="heapTotal"}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Heap memory usage is above 90%"

      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is below 50%"

      # Low student attendance
      - alert: LowStudentAttendance
        expr: attendance_rate < 80
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Low student attendance rate"
          description: "Attendance rate is below 80%"

      # High failed login attempts
      - alert: HighFailedLoginAttempts
        expr: rate(http_requests_total{route="/api/auth/login",status_code="401"}[5m]) > 10
        for: 5m
        labels:
          severity: security
        annotations:
          summary: "High number of failed login attempts"
          description: "More than 10 failed login attempts per minute"