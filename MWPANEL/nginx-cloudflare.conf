# Configuration for direct Cloudflare origin
# Listens on alternative ports to avoid conflicts

# HTTP redirect for Cloudflare
server {
    listen 8080;
    server_name plataforma.mundoworld.school;
    
    location / {
        return 301 https://$server_name:8443$request_uri;
    }
}

# HTTPS for Cloudflare origin
server {
    listen 8443 ssl http2;
    server_name plataforma.mundoworld.school;
    
    ssl_certificate /etc/nginx/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare/key.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    client_max_body_size 50M;
    
    # Serve static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        
        # Cloudflare cache headers
        add_header Cache-Control "public, max-age=300";
    }
    
    # API proxy to backend
    location /api/ {
        proxy_pass http://172.20.0.5:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    
    # Static uploads
    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}