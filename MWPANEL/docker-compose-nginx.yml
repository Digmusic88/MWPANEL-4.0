version: '3.8'

services:
  nginx-prod:
    image: nginx:alpine
    container_name: mw-panel-nginx-prod
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./dist-frontend:/usr/share/nginx/html
      - ./nginx-production.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - mw-network
    restart: unless-stopped

networks:
  mw-network:
    external: true
    name: mw-panel_default