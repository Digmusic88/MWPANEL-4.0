# Temporary HTTP-only configuration for testing

# HTTP access for localhost/development (127.0.0.1, localhost)
server {
    listen 80 default_server;
    server_name 127.0.0.1 localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Serve frontend static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @fallback;
        index index.html;
    }

    # SPA routing fallback
    location @fallback {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://172.18.0.6:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP redirect for external domain (temporary redirect to http for testing)
server {
    listen 80;
    server_name plataforma.mundoworld.school;

