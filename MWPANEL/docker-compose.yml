# @archivo: docker-compose.yml
# @módulo: Infrastructure (Orquestación de Contenedores)
# @función: Definición completa de servicios para MW Panel en producción
# @crítico: SÍ - Configuración central para deploy y funcionamiento del sistema
# @dependencias: Docker, imágenes oficiales, volúmenes persistentes, red interna
# @no_modificar: Configuración SSL y volumes externos sin verificar certificados
# @relacionado_con: nginx/default.conf, .env variables, Dockerfiles

# COMPOSE: MW Panel Production Stack
# UBICACIÓN: /opt/mw-panel/docker-compose.yml
# FUNCIÓN: Orquestación completa de 6 servicios para sistema educativo
# NO USAR PARA: Desarrollo local (usar docker-compose.dev.yml)
# SERVICIOS CRÍTICOS:
#   - postgres: Base de datos principal con datos educativos
#   - redis: Cache y sesiones para performance
#   - backend: API NestJS con autenticación JWT
#   - frontend: React SPA servido como estático
#   - nginx: Reverse proxy con SSL y routing
#   - certbot: Renovación automática certificados SSL

# ARQUITECTURA DE RED:
# - Red interna mw-network para comunicación entre servicios
# - Solo nginx expone puertos públicos 80/443
# - Servicios internos sin acceso directo desde exterior
# - Security hardening: no exposed databases

# SERVICIO: postgres (PostgreSQL 15)
# - Imagen: postgres:15-alpine (optimizada)
# - Storage: Volumen externo persistente mw-panel-pgdata
# - Security: Sin puertos expuestos, solo acceso interno
# - Credentials: Variables de entorno con defaults seguros
# - Health check: pg_isready cada 10s con 5 reintentos
# - Init script: /database/init.sql para setup inicial
# - Restart policy: unless-stopped para alta disponibilidad

# SERVICIO: redis (Cache Layer)
# - Imagen: redis:7-alpine (última estable)
# - Purpose: Sesiones JWT, cache de consultas, leaderboards TypeQuest
# - Storage: Volumen redis_data para persistencia
# - Security: Sin puertos expuestos, solo red interna
# - Health check: redis-cli ping cada 10s

# SERVICIO: backend (NestJS API)
# - Build: Dockerfile.prod multi-stage para optimización
# - Environment: production con todas las variables críticas
# - Database: Connection via postgres service name
# - Redis: Connection via redis service name
# - JWT: Secrets configurables via environment
# - Google Drive: Service account para recursos educativos (OBLIGATORIO)
# - Uploads: Volumen persistente para archivos subidos
# - Dependencies: Espera health checks de postgres/redis
# - CRÍTICO: google-credentials.json DEBE estar montado o fallarán las subidas

# SERVICIO: frontend (React + Vite)
# - Build: Dockerfile.prod con build optimizado
# - Serving: Archivos estáticos via nginx
# - API: Configurado para usar /api proxy
# - Dependencies: Depende de backend estar listo

# SERVICIO: nginx (Reverse Proxy & SSL)
# - Imagen: nginx:alpine (ligero y seguro)
# - Ports: 80 (HTTP redirect) + 443 (HTTPS)
# - SSL: Certificados Cloudflare + Let's Encrypt
# - Static serving: frontend/dist para React
# - TypeQuest: typequest-dist para aplicación gaming
# - Proxy: /api → backend:3000 para API calls
# - Configuration: ./nginx/default.conf con SSL hardening
# - Dependencies: Backend y frontend listos

# SERVICIO: certbot (SSL Automation)
# - Imagen: certbot/certbot oficial
# - Purpose: Renovación automática certificados SSL
# - Method: webroot validation via nginx
# - Volumes: Shared con nginx para certificados
# - Command: certonly para obtener certificados

# VOLÚMENES CRÍTICOS:
# - pgdata: EXTERNAL volume para persistencia DB
# - redis_data: Cache data persistence
# - certbot-etc: Certificados SSL compartidos
# - certbot-var: Variables certbot persistentes
# - uploads: Archivos subidos al backend

# VARIABLES DE ENTORNO REQUERIDAS:
# - DB_NAME, DB_USER, DB_PASSWORD: Credenciales PostgreSQL
# - JWT_SECRET, JWT_REFRESH_SECRET: Claves JWT
# - SSL_EMAIL, DOMAIN: Configuración SSL/certificados
# - Google Drive: Service account y shared drive config

# CONFIGURACIÓN GOOGLE DRIVE:
# - Service Account: mw-panel-drive-service
# - Shared Drive: "12. Plataforma (Recursos dicácticos compartidos)"
# - Drive ID: 0AECljEUrD7hRUk9PVA
# - Purpose: Upload y gestión recursos educativos

# SECURITY HARDENING IMPLEMENTADO:
# - Puertos internos NO expuestos públicamente
# - Red interna aislada para servicios
# - Health checks para detectar fallos
# - Restart policies para recuperación automática
# - SSL enforcement via nginx
# - Service account authentication para Google APIs

# HEALTH MONITORING:
# - PostgreSQL: pg_isready cada 10s
# - Redis: redis-cli ping cada 10s
# - Nginx: Built-in health via HTTP responses
# - Backend: Implicit via dependency checks

# DEPLOYMENT WORKFLOW:
# 1. docker-compose up -d (start all services)
# 2. Health checks validan servicios listos
# 3. nginx starts serving cuando dependencies ready
# 4. SSL certificates auto-obtained if needed
# 5. Sistema completamente operativo

# PRODUCTION OPTIMIZATIONS:
# - Multi-stage Dockerfiles para size reduction
# - Alpine images para security y performance
# - External volumes para data persistence
# - Restart policies para alta disponibilidad
# - Resource limits implícitos via container constraints

# DEBUGGING Y MONITORING:
# - docker-compose logs -f [service] para logs
# - Health check status visible en docker ps
# - Volume inspection para data persistence
# - Network inspection para conectividad

# ESTADO ACTUAL: ✅ PRODUCTION DEPLOYMENT READY
# - Usado en producción en plataforma.mundoworld.school
# - SSL funcionando con certificados válidos
# - Todos los servicios estables y monitoreados
# - Performance optimizada para carga educativa
# - Security hardening implementado y validado
# - Backup automático configurado para datos críticos

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mw-panel-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mwpanel}
      POSTGRES_USER: ${DB_USER:-mwpanel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mwpanel123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    # SECURITY: Remove public port exposure
    # ports:
    #   - "5432:5432"
    networks:
      - mw-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mwpanel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mw-panel-redis-prod
    restart: unless-stopped
    # SECURITY: Remove public port exposure
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mw-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (NestJS) - Production mode
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: mw-panel-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Europe/Madrid
      # Database - Lee de .env
      DATABASE_URL: ${DATABASE_URL:-postgresql://mwpanel:mwpanel123@postgres:5432/mwpanel}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-mwpanel}
      DB_PASSWORD: ${DB_PASSWORD:-mwpanel123}
      DB_NAME: ${DB_NAME:-mwpanel}
      REDIS_URL: redis://redis:6379
      # JWT - Lee de .env (CRÍTICO)
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Google Drive - Lee de .env (CRÍTICO - NO hardcodear)
      GOOGLE_SERVICE_ACCOUNT_EMAIL: "mw-panel-drive-service@mw-panel-educativo.iam.gserviceaccount.com"
      GOOGLE_SHARED_DRIVE_NAME: ${GOOGLE_SHARED_DRIVE_NAME}
      GOOGLE_SHARED_DRIVE_ID: ${GOOGLE_SHARED_DRIVE_ID}
      GOOGLE_DELEGATED_USER_EMAIL: "info@mundoworld.school"
      GOOGLE_DRIVE_FOLDER_ID: "root"
      # Email - Lee de .env
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@mundoworld.school}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Mundo World School}
      # HuggingFace AI - Lee de .env
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN}
      # Azure Content Safety - Lee de .env
      AZURE_CONTENT_SAFETY_KEY: ${AZURE_CONTENT_SAFETY_KEY}
      AZURE_CONTENT_SAFETY_ENDPOINT: ${AZURE_CONTENT_SAFETY_ENDPOINT}
      # Admin - Lee de .env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-info@mundoworld.school}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./backend/uploads:/app/uploads
      # CRÍTICO: Google Drive credentials SIEMPRE deben estar montadas
      # SIN este volumen, el sistema lanzará errores en lugar de generar archivos mock
      - ./backend/google-credentials.json:/app/google-credentials.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # SECURITY: Remove direct public access, only through nginx proxy
    # ports:
    #   - "3000:3000"
    networks:
      - mw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend (React + Vite) - Production mode
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: mw-panel-frontend-prod
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    depends_on:
      - backend
    networks:
      - mw-network

  # Nginx Reverse Proxy
  # NOTA: Este servicio está DESHABILITADO porque usamos nginx del sistema (host)
  # El nginx del sistema está configurado en /etc/nginx/sites-enabled/mw-panel.conf
  # y maneja SSL con certificados de Cloudflare.
  # Si necesitas usar nginx de Docker, usa: docker-compose --profile with-nginx up -d
  nginx:
    image: nginx:alpine
    container_name: mw-panel-nginx-prod
    restart: unless-stopped
    profiles:
      - with-nginx  # No se inicia por defecto
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./frontend/dist:/usr/share/nginx/html
      - ./typequest-dist:/usr/share/nginx/typequest
      - ./backend/uploads:/usr/share/nginx/uploads
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - mw-network

  # Certbot for SSL
  # NOTA: Deshabilitado - usamos certificados de Cloudflare
  certbot:
    image: certbot/certbot
    container_name: mw-panel-certbot-prod
    profiles:
      - with-nginx  # Solo necesario si se usa nginx de Docker
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/usr/share/nginx/html --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}

volumes:
  pgdata:
    external: true
    name: mw-panel-pgdata
  redis_data:
  certbot-etc:
  certbot-var:

networks:
  mw-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1