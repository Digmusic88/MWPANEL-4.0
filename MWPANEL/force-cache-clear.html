<!DOCTYPE html>
<html>
<head>
    <title>Cache Clear Force</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <h1>Cache Clearing Page</h1>
    <p>This page forces cache clearing. New timestamp: 1755708988688</p>
    <script>
        // Force refresh
        setTimeout(() => {
            window.location.href = '/student/mis-apuntes?t=' + Date.now();
        }, 2000);
    </script>
</body>
</html>
